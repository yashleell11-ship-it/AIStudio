    <style>
        .site-community-footer {
            border-top: 1px solid rgba(255, 255, 255, .08);
            background: #030712;
            color: #f9fafb;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .site-community-footer__inner {
            width: min(100% - 2rem, 80rem);
            margin-inline: auto;
            padding-block: 2rem 1.25rem;
        }

        .discord-community-cta {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
            overflow: hidden;
            padding: 1.5rem;
            border: 1px solid rgba(129, 140, 248, .3);
            border-radius: 1.25rem;
            background:
                radial-gradient(circle at 10% 0%, rgba(129, 140, 248, .22), transparent 38%),
                linear-gradient(135deg, rgba(88, 101, 242, .16), rgba(17, 24, 39, .92));
            box-shadow: 0 18px 50px rgba(0, 0, 0, .22);
        }

        .discord-community-cta__copy {
            position: relative;
            display: flex;
            align-items: center;
            gap: 1rem;
            min-width: 0;
        }

        .discord-community-cta__icon {
            display: grid;
            flex: 0 0 3.25rem;
            width: 3.25rem;
            height: 3.25rem;
            place-items: center;
            border-radius: 1rem;
            background: #5865f2;
            box-shadow: 0 10px 25px rgba(88, 101, 242, .35);
        }

        .discord-community-cta__icon svg {
            width: 1.65rem;
            height: 1.65rem;
        }

        .discord-community-cta__eyebrow {
            margin: 0 0 .25rem;
            color: #a5b4fc;
            font-size: .72rem;
            font-weight: 800;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .discord-community-cta__title {
            margin: 0;
            color: #fff;
            font-size: clamp(1.05rem, 2vw, 1.35rem);
            font-weight: 800;
            line-height: 1.25;
        }

        .discord-community-cta__description {
            max-width: 45rem;
            margin: .4rem 0 0;
            color: #9ca3af;
            font-size: .875rem;
            line-height: 1.55;
        }

        .discord-community-cta__button {
            position: relative;
            display: inline-flex;
            flex: 0 0 auto;
            min-height: 3rem;
            align-items: center;
            justify-content: center;
            gap: .55rem;
            padding: .75rem 1.15rem;
            border-radius: .85rem;
            background: #5865f2;
            color: #fff;
            font-size: .875rem;
            font-weight: 800;
            text-decoration: none;
            box-shadow: 0 10px 28px rgba(88, 101, 242, .3);
            transition: transform .18s ease, background-color .18s ease, box-shadow .18s ease;
        }

        .discord-community-cta__button:hover {
            transform: translateY(-2px);
            background: #6875f5;
            box-shadow: 0 14px 34px rgba(88, 101, 242, .4);
        }

        .discord-community-cta__button:focus-visible {
            outline: 3px solid rgba(165, 180, 252, .75);
            outline-offset: 3px;
        }

        .site-community-footer__links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: .75rem;
            padding-top: 1rem;
            color: #6b7280;
            font-size: .8rem;
        }

        .site-community-footer__links a {
            color: #a78bfa;
            font-weight: 600;
            text-decoration: none;
        }

        .site-community-footer__links a:hover {
            color: #c4b5fd;
        }

        @media (max-width: 639px) {
            .site-community-footer__inner {
                width: min(100% - 1.5rem, 80rem);
                padding-block: 1rem calc(4.75rem + env(safe-area-inset-bottom, 0px));
            }

            .discord-community-cta {
                flex-direction: column;
                align-items: stretch;
                gap: 1.15rem;
                padding: 1.1rem;
                border-radius: 1rem;
            }

            .discord-community-cta__copy {
                align-items: flex-start;
            }

            .discord-community-cta__icon {
                flex-basis: 2.75rem;
                width: 2.75rem;
                height: 2.75rem;
                border-radius: .85rem;
            }

            .discord-community-cta__description {
                font-size: .8rem;
            }

            .discord-community-cta__button {
                width: 100%;
            }

            .site-community-footer__links {
                flex-wrap: wrap;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .discord-community-cta__button {
                transition: none;
            }
        }
    </style>
