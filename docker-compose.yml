# ManhwaManiacs app — one compose definition, fully parameterized so each
# environment (production / staging / preview-<pr>) is an isolated stack: its own
# compose project, container names, image tags, env, build, volume, restart policy
# and logs. The deploy engine (ops/deploy.sh) writes a per-environment .env and runs
# `docker compose -p manhwamaniacs-<slug> up -d --build`.
#
# Topology: `frontend` is edge-facing (Caddy proxies the apex to it on :3000) and
# reverse-proxies /api/* to `backend` over a private per-project network. `backend`
# also joins `edge` so Caddy can serve it directly on the app.<host> subdomain (the
# Android APK landing page + download); it still never exposes a host port. Persistent
# state is only the metadata SQLite DB + settings.json, on the `data` volume mounted
# into backend. Chapter images are never stored server-side — clients download them
# directly through the source image proxy (see
# docs/superpowers/specs/2026-09-03-backend-source-native-design.md).
services:
  backend:
    build:
      context: ./backend
    image: ${MM_IMAGE:-local/manhwamaniacs:production}-backend
    container_name: ${MM_CONTAINER:-manhwamaniacs-production}-backend
    restart: ${MM_RESTART:-unless-stopped}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      - APP_ENV=${APP_ENV:-production}
      - MM_DB_PATH=/data/manhwamaniacs.db
      - MM_SETTINGS_PATH=/data/settings.json
      # TTL (minutes) for source_series_cache — the read-through connector
      # metadata cache that lets the library grid / continue-reading strip /
      # notifications render titles+covers without a connector call every time.
      # Default 360 (6h); a row past its TTL is refetched on next read, and a
      # stale row is still served if the connector is down (spec §3.10).
      - MM_SOURCE_CACHE_TTL_MINUTES=${MM_SOURCE_CACHE_TTL_MINUTES:-360}
      # Auth (see docs/AUTH.md). Admin-only endpoints are gated by the session
      # user's is_admin, not a token — the first registered account bootstraps as
      # admin. Cookies are Secure by default (all envs are HTTPS behind Caddy).
      - MM_COOKIE_SECURE=${MM_COOKIE_SECURE:-true}
      # Allow self-service signup after the bootstrap admin exists. Defaults to
      # CLOSED: these instances are internet-facing via Cloudflare, and an open
      # signup on a public host lets strangers create accounts on the household
      # server. Set true explicitly (and briefly) to invite someone.
      #
      # Note this flag does NOT gate the bootstrap account — routes/auth.py:164
      # only enforces it once `user_count() > 0`, so an instance with an empty
      # users table is always claimable by whoever registers first. Closing that
      # window means creating the owner account, not flipping this flag.
      - MM_REGISTRATION_ENABLED=${MM_REGISTRATION_ENABLED:-false}
      # Latest Android APK served at app.<host>/app/download. The deploy populates
      # ./apk/app-release.apk (see ops/deploy.sh); mounted read-only below. The
      # pubspec (version label) and screenshots (landing imagery) are addressed by
      # absolute in-container paths, not REPO_ROOT — the backend image root resolves
      # to "/", so REPO_ROOT-relative defaults would miss the mounts below.
      - MM_APK_PATH=${MM_APK_PATH:-/app/apk/app-release.apk}
      - MM_PUBSPEC_PATH=${MM_PUBSPEC_PATH:-/app/mobile/pubspec.yaml}
      - MM_SCREENSHOTS_DIR=${MM_SCREENSHOTS_DIR:-/app/mobile/docs/screenshots}
      # Latest unsigned iOS build, served at app.<host>/app/ios/download and listed
      # in the SideStore source at /app/source.json. Populated by
      # ops/fetch-ios-build.sh from the GitHub Actions macOS runner, not by the
      # deploy — iOS builds need a Mac.
      - MM_IPA_PATH=${MM_IPA_PATH:-/app/ipa/ManhwaManiacs.ipa}
      # Origin baked into the source manifest's download links. Those URLs are
      # fetched by the phone, so they must be publicly resolvable — the deploy
      # sets this to https://$APP_HOST.
      - MM_PUBLIC_BASE_URL=${MM_PUBLIC_BASE_URL:-}
    expose:
      - "8000"
    networks: [internal, edge]
    volumes:
      - data:/data
      # Read-only APK drop + live pubspec (version label) + marketing screenshots
      # (landing imagery). The ./apk dir is created by the deploy even when empty, so
      # a missing APK reads as "not built yet" instead of a broken bind mount.
      - ./apk:/app/apk:ro
      # Same pattern for the iOS build; dir is created empty by the deploy so a
      # missing .ipa reads as "not published yet" instead of a broken mount.
      - ./ipa:/app/ipa:ro
      - ./mobile/pubspec.yaml:/app/mobile/pubspec.yaml:ro
      - ./mobile/docs/screenshots:/app/mobile/docs/screenshots:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    build:
      context: ./frontend
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        APP_ENV: ${APP_ENV:-production}
        # Browser calls same-origin /api; Next proxies it to the backend below.
        NEXT_PUBLIC_API_URL: ${MM_PUBLIC_API_URL:-/api}
        BACKEND_INTERNAL_URL: http://${MM_CONTAINER:-manhwamaniacs-production}-backend:8000
    image: ${MM_IMAGE:-local/manhwamaniacs:production}
    container_name: ${MM_CONTAINER:-manhwamaniacs-production}
    restart: ${MM_RESTART:-unless-stopped}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      - NODE_ENV=production
      - APP_ENV=${APP_ENV:-production}
      - GIT_BRANCH=${GIT_BRANCH:-unknown}
      - GIT_COMMIT=${GIT_COMMIT:-dev}
      - BUILD_TIME=${BUILD_TIME:-}
      - BACKEND_INTERNAL_URL=http://${MM_CONTAINER:-manhwamaniacs-production}-backend:8000
    expose:
      - "3000"
    networks: [edge, internal]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  edge:
    external: true
  internal:
    driver: bridge

volumes:
  data:
    name: ${MM_VOLUME:-manhwamaniacs-production-data}
