name: manhwamaniacs
description: ManhwaManiacs mobile client — manga/manhwa reader
publish_to: 'none'
version: 1.3.2+17

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # State management + DI
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.3
  connectivity_plus: ^6.0.5

  # Local storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # Image caching
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1

  # App/device info
  package_info_plus: ^8.0.0
  path_provider: ^2.1.3

  # Logging
  logger: ^2.3.0

  # Utilities
  intl: ^0.19.0
  collection: ^1.18.0

  # Reader — keep screen awake while reading
  wakelock_plus: ^1.2.8

  # Reader — request high refresh-rate display modes on Android
  flutter_displaymode: ^0.6.0

  # External URL launcher (APK update download)
  url_launcher: ^6.3.0

  # Backup & restore — pick a backup file from device storage to upload
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Testing
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    # Syne (display / headings) and DM Sans (body / UI) are bundled as variable
    # fonts so the app NEVER depends on runtime fetching from fonts.gstatic.com.
    # Weights are driven per-style via FontVariation('wght', …) in
    # AppTypography, so a single variable file covers every weight we use.
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: BebasNeue
      fonts:
        - asset: assets/fonts/BebasNeue-Regular.ttf
          weight: 700
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
          weight: 400
