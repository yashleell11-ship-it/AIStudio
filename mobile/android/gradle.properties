# Gradle daemon heap. This replaces `-Xmx8G -XX:MaxMetaspaceSize=4G
# -XX:+HeapDumpOnOutOfMemoryError`, which was set on 2026-07-03 in reaction to a
# JVM crash — but the crash log it came from (a Windows hs_err, since removed)
# says the ceiling was the *cause*, not the cure: a 16 GB laptop with 1.1 GB
# physical and 38 MB of pagefile left, dying while reserving 8 GB of heap plus
# 4 GB of metaspace. Measured on this tree, the heaviest task in a release build
# (R8 over :app + 13 plugin modules + ML Kit) peaks far below 4 GB, so the lower
# ceiling costs nothing on a big machine and stops the small one thrashing.
# HeapDumpOnOutOfMemoryError went with it: it dumps a multi-GB .hprof into
# android/ on exactly the machine that has just run out of memory to spare.
#
# Changing this line forces a fresh Gradle daemon, so the first build after
# editing it pays ~50s of daemon startup. That is a one-off, not a regression.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -Dfile.encoding=UTF-8

# :app plus 13 Flutter plugin modules. Measured, release build with build/ wiped
# and a warm daemon: ~20s with neither of these, ~16s with parallel alone, ~11s
# with both. Same APK, byte for byte (41,295,479 B each time).
#
# Windows caveat: the same path-relativization bug that forces
# kotlin.incremental=false below (pub cache on C:, project on D:) lives in the
# code the build cache uses to relocate outputs. The Android release build is
# made on the Linux laptop, so this is enabled for it; if a Windows build ever
# fails inside KotlinCompile with a RelocatableFileToPathConverter error, this
# line is the first thing to turn off.
org.gradle.parallel=true
org.gradle.caching=true

# Deliberately NOT org.gradle.configuration-cache. Measured: the Flutter Gradle
# Plugin's own ReleaseMinSdkCheck task (com.flutter.gradle.DependencyVersionChecker)
# captures Project, ConfigurationContainer and DependencyHandler references, so
# every build reports "6 problems were found storing the configuration cache"
# and no entry is ever reused — all cost, no saving. Worth re-testing after a
# Flutter upgrade; nothing in this repo can fix it.

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin incremental compilation fails when pub cache (C:) and project (D:) are on
# different Windows drive roots — RelocatableFileToPathConverter cannot relativize paths.
kotlin.incremental=false
